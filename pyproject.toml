[project]
name = "noteripper"
version = "0.1.0"
description = "An AI-based note system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
noteripper = "noteripper.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noteripper"]
